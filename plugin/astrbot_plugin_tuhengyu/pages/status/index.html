<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图恒宇 · 运行状态</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <h1 id="title">运行状态</h1>
        <div class="head-right">
          <span id="clock" class="clock">—</span>
          <button id="refresh" class="btn btn-ghost" type="button">刷新</button>
        </div>
      </header>

      <p id="notice" class="notice" hidden></p>

      <section class="hero">
        <div class="hero-main">
          <span id="scene" class="scene">读取中 …</span>
          <span id="awake" class="pill">—</span>
        </div>
        <div class="hero-sub">
          <span>作息来源：<b id="source">—</b></span>
          <span id="schedule-desc">—</span>
          <span id="persona-state">—</span>
        </div>
      </section>

      <section class="grid">
        <div class="card">
          <div class="card-label">触发概率</div>
          <div id="prob" class="card-value">—</div>
          <div id="prob-detail" class="card-hint">—</div>
        </div>
        <div class="card">
          <div class="card-label">检查间隔</div>
          <div id="interval" class="card-value">—</div>
          <div class="card-hint">调度器轮询周期</div>
        </div>
        <div class="card">
          <div class="card-label">发空间</div>
          <div id="moment" class="card-value">—</div>
          <div id="moment-detail" class="card-hint">—</div>
        </div>
        <div class="card">
          <div class="card-label">上次发空间</div>
          <div id="last-moment" class="card-value">—</div>
          <div class="card-hint">重启后重置（内存态）</div>
        </div>
      </section>

      <section class="panel">
        <h2>操作</h2>

        <div class="action">
          <div class="action-main">
            <button id="reschedule" class="btn" type="button">重算作息</button>
            <div class="action-text">
              <div class="action-title">换人设后按这个</div>
              <div class="action-desc">
                丢弃盘上已有的作息，重新读 <code>persona_prompt</code>，让模型按新的人设生成一份一天的作息。
                作息只在生成时读人设，改完人设不按这里不会生效。
              </div>
              <div id="reschedule-warn" class="action-warn" hidden></div>
            </div>
          </div>
        </div>

        <div class="action">
          <div class="action-main">
            <button id="test-moment" class="btn btn-warn" type="button">测试发一条</button>
            <div class="action-text">
              <div class="action-title">立刻发一条 QQ 空间动态（调试用）</div>
              <div class="action-desc">
                等同 QQ 里的 <code>/图恒宇测试</code>：用当前作息生成一条内容并发出去。
                <b>会产生真实的空间动态</b>，不要频繁点。
              </div>
              <div id="test-result" class="action-result" hidden></div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>作息时段</h2>
        <table class="table">
          <thead>
            <tr>
              <th>时段</th>
              <th>场景</th>
              <th>状态</th>
              <th>醒着</th>
            </tr>
          </thead>
          <tbody id="periods">
            <tr><td colspan="4" class="empty">读取中 …</td></tr>
          </tbody>
        </table>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
